[project]
name = "picode-runtime"
version = "0.1.0"
description = "Python Agent Runtime for PiCode"
requires-python = ">=3.11"
dependencies = [
	"pydantic==2.5.3",
]

[project.optional-dependencies]
dev = [
	"pytest==7.4.4",
	"ruff==0.9.10",
	"pyright==1.1.396",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
